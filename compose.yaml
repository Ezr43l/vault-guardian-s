name: vault-guardian

services:
  vault-guardian:
    image: ${VG_IMAGE:-ghcr.io/ezr43l/vault-guardian-s:1.0.18}
    build:
      context: .
      dockerfile: docker/guardian/Dockerfile
      args:
        VERSION: ${VG_BUILD_VERSION:-1.0.18}
        SOURCE_URL: ${VG_SOURCE_URL:-https://github.com/Ezr43l/vault-guardian-s}
        LICENSE: ${VG_LICENSE_SPDX:-Apache-2.0}
    container_name: ${VG_CONTAINER_NAME:-vault-guardian}
    restart: unless-stopped
    user: "0:0"
    environment:
      VG_PORT: "6062"
      VG_STATE_DIR: /state
      VG_INSTANCES_FILE: /state/instances.json
      VG_DATA_ROOTS: /instances
      VG_DOCKER_SOCKET: /var/run/docker.sock
    ports:
      - ${VG_BIND_ADDRESS:-127.0.0.1}:${VG_HOST_PORT:-6062}:6062
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${VG_STATE_PATH:?Configura VG_STATE_PATH en .env}:/state
      - ${VG_DATA_PATH:?Configura VG_DATA_PATH en .env}:/instances:rw
      - /var/run/docker.sock:/var/run/docker.sock:rw
    labels:
      com.vault-guardian.role: app
    read_only: true
    tmpfs:
      # Techo no preasignado para conservar el backend directo.
      - /tmp:size=2g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6062/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    stop_grace_period: 20s
