name: Publish release image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  actions: read
  attestations: write
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/ezr43l/vault-guardian-s

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: version
        name: Enforce public release gates
        shell: bash
        env:
          LICENSE_SPDX: ${{ vars.LICENSE_SPDX }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Ezr43l/vault-guardian-s" || {
            echo "Las releases sólo se publican desde Ezr43l/vault-guardian-s" >&2
            exit 1
          }
          test -f LICENSE || { echo "Falta LICENSE" >&2; exit 1; }
          test "$LICENSE_SPDX" = "Apache-2.0" || {
            echo "LICENSE_SPDX debe ser Apache-2.0" >&2
            exit 1
          }
          version="$(tr -d ' \r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "VERSION debe ser una versión estable X.Y.Z exacta" >&2
            exit 1
          }
          test "$GITHUB_REF_NAME" = "v${version}" || {
            echo "El tag ${GITHUB_REF_NAME} no coincide con VERSION=${version}" >&2
            exit 1
          }
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = "tag" || {
            echo "La release exige un tag anotado, no un tag ligero" >&2
            exit 1
          }
          test "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")" = "$GITHUB_SHA" || {
            echo "El tag anotado no apunta al commit que ejecuta la release" >&2
            exit 1
          }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Require successful CI on this exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&status=success&per_page=1" \
            --jq '.total_count')"
          test "$count" -ge 1 || {
            echo "No existe una ejecución CI correcta para ${GITHUB_SHA}" >&2
            exit 1
          }

      - name: Validate release tree and dependencies
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env.example config --quiet
          python -c "import glob, xml.etree.ElementTree as E; [E.parse(path) for path in glob.glob('unraid/*.xml')]"
          version="$(tr -d ' \r\n' < VERSION)"
          grep -F "ghcr.io/ezr43l/vault-guardian-s:$version" unraid/my-Vault-Guardian.xml
          test "$(grep -Fc 'Target="/var/run/docker.sock"' unraid/my-Vault-Guardian.xml)" = 1
          test ! -e unraid/my-Vault-Guardian-Docker-Control.xml
          python -m pip install --disable-pip-version-check pip-audit==2.10.1 bandit==1.9.4
          pip-audit --requirement docker/guardian/requirements.txt
          bandit -r docker/guardian/app -q
          docker run --rm -v "$PWD:/repo:ro" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --redact --exit-code=1

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and scan both release architectures before publishing
        shell: bash
        env:
          LICENSE_SPDX: ${{ vars.LICENSE_SPDX }}
        run: |
          set -euo pipefail
          cache_dir="$RUNNER_TEMP/trivy-cache"
          mkdir -p "$cache_dir"
          for platform in linux/amd64 linux/arm64; do
            arch="${platform#*/}"
            candidate="vault-guardian:release-${arch}"
            docker buildx build --pull --platform "$platform" --load \
              --file docker/guardian/Dockerfile --tag "$candidate" \
              --build-arg "VERSION=${{ steps.version.outputs.value }}" \
              --build-arg "SOURCE_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --build-arg "VCS_REF=${GITHUB_SHA}" \
              --build-arg "LICENSE=${LICENSE_SPDX}" .
            test "$(docker image inspect "$candidate" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "${{ steps.version.outputs.value }}"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$cache_dir:/root/.cache" \
              aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
              image --skip-version-check --scanners vuln --severity CRITICAL,HIGH \
              --exit-code 1 "$candidate"
            pwsh ./docker/guardian/tests/secure_single_container_lab.ps1 -Image "$candidate"
          done

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: existing
        name: Recover only a safe draft and refuse published artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMMUTABLE_RELEASES_ENABLED: ${{ vars.IMMUTABLE_RELEASES_ENABLED }}
        run: |
          set -euo pipefail
          test "$IMMUTABLE_RELEASES_ENABLED" = "true" || {
            echo "La puerta externa debe confirmar Immutable Releases y fijar IMMUTABLE_RELEASES_ENABLED=true" >&2
            exit 1
          }
          releases="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          matches="$(jq -c --arg tag "$GITHUB_REF_NAME" \
            '[.[][] | select(.tag_name == $tag)]' <<<"$releases")"
          count="$(jq 'length' <<<"$matches")"
          test "$count" -le 1 || {
            echo "Hay varias releases para ${GITHUB_REF_NAME}" >&2
            exit 1
          }
          if test "$count" -eq 1; then
            release="$(jq '.[0]' <<<"$matches")"
            jq -e --arg tag "$GITHUB_REF_NAME" \
              '.tag_name == $tag and .draft == true and .immutable == false' \
              <<<"$release" >/dev/null || {
              echo "La release ${GITHUB_REF_NAME} ya está publicada; no se modifica" >&2
              exit 1
            }
            unexpected="$(jq -r '
              [.assets[].name | select(
                . != "SHA256SUMS" and
                . != "image-digest.txt" and
                . != "sbom-amd64.spdx.json" and
                . != "sbom-arm64.spdx.json"
              )] | join(",")' <<<"$release")"
            test -z "$unexpected" || {
              echo "El draft contiene assets ajenos al contrato: ${unexpected}" >&2
              exit 1
            }
            echo "release_state=draft" >> "$GITHUB_OUTPUT"
            echo "release_id=$(jq -r '.id' <<<"$release")" >> "$GITHUB_OUTPUT"
          else
            echo "release_state=absent" >> "$GITHUB_OUTPUT"
          fi

          reference="${IMAGE_NAME}:${{ steps.version.outputs.value }}"
          inspect_error="$RUNNER_TEMP/existing-image-error.txt"
          if manifest="$(docker buildx imagetools inspect "$reference" \
            --format '{{json .Manifest}}' 2>"$inspect_error")"; then
            digest="$(jq -r '.digest' <<<"$manifest")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "El manifiesto existente no ofrece un digest válido" >&2
              exit 1
            }
            platforms="$(jq -c '
              [.manifests[]
               | select(.platform.os != "unknown")
               | [.platform.os, .platform.architecture]] | sort' <<<"$manifest")"
            test "$platforms" = '[["linux","amd64"],["linux","arm64"]]' || {
              echo "La imagen existente no contiene exactamente AMD64 y ARM64" >&2
              exit 1
            }
            for platform in linux/amd64 linux/arm64; do
              config="$(docker buildx imagetools inspect "$reference" \
                --format "{{json (index .Image \"${platform}\")}}")"
              jq -e \
                --arg version "${{ steps.version.outputs.value }}" \
                --arg revision "$GITHUB_SHA" \
                --arg source "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
                '.config.Labels["org.opencontainers.image.version"] == $version and
                 .config.Labels["org.opencontainers.image.revision"] == $revision and
                 .config.Labels["org.opencontainers.image.source"] == $source and
                 .config.Labels["org.opencontainers.image.licenses"] == "Apache-2.0"' \
                <<<"$config" >/dev/null || {
                echo "La imagen existente no pertenece al SHA y contrato de esta release" >&2
                exit 1
              }
            done
            echo "image_exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          elif grep -Eiq 'not found|manifest unknown' "$inspect_error"; then
            echo "image_exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "$inspect_error" >&2
            echo "No se pudo determinar de forma segura si la imagen ya existe" >&2
            exit 1
          fi

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}

      - name: Permit only the exact immutable OCI version tag
        shell: bash
        env:
          GENERATED_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          expected="${IMAGE_NAME}:${{ steps.version.outputs.value }}"
          test "$GENERATED_TAGS" = "$expected" || {
            echo "metadata-action intentó publicar tags adicionales: ${GENERATED_TAGS}" >&2
            exit 1
          }

      - id: push
        name: Build, test and publish AMD64/ARM64
        if: steps.existing.outputs.image_exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/guardian/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            VCS_REF=${{ github.sha }}
            LICENSE=${{ vars.LICENSE_SPDX }}
          provenance: mode=max
          sbom: true

      - id: image
        name: Freeze the published digest for all remaining gates
        shell: bash
        env:
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          PUSHED_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          digest="$PUSHED_DIGEST"
          if test "${{ steps.existing.outputs.image_exists }}" = "true"; then
            digest="$EXISTING_DIGEST"
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "No se obtuvo un digest OCI válido" >&2
            exit 1
          }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Verify published manifest, vulnerabilities and attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          manifest="$(docker buildx imagetools inspect "${IMAGE_NAME}@${DIGEST}")"
          grep -F 'linux/amd64' <<<"$manifest"
          grep -F 'linux/arm64' <<<"$manifest"
          cache_dir="$RUNNER_TEMP/trivy-cache"
          mkdir -p release-artifacts "$cache_dir"
          for platform in linux/amd64 linux/arm64; do
            arch="${platform#*/}"
            docker run --rm -v "$HOME/.docker:/root/.docker:ro" \
              -v "$cache_dir:/root/.cache" -v "$PWD/release-artifacts:/reports" \
              aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
              image --skip-version-check --platform "$platform" --scanners vuln \
              --severity CRITICAL,HIGH --exit-code 1 "${IMAGE_NAME}@${DIGEST}"
            docker run --rm -v "$HOME/.docker:/root/.docker:ro" \
              -v "$cache_dir:/root/.cache" -v "$PWD/release-artifacts:/reports" \
              aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
              image --skip-version-check --platform "$platform" --scanners vuln \
              --format spdx-json --output "/reports/sbom-${arch}.spdx.json" \
              "${IMAGE_NAME}@${DIGEST}"
          done
          gh attestation verify "oci://${IMAGE_NAME}@${DIGEST}" --repo "$GITHUB_REPOSITORY"
          printf 'image=%s\nversion=%s\ncommit=%s\ndigest=%s\n' \
            "$IMAGE_NAME" "${{ steps.version.outputs.value }}" "$GITHUB_SHA" "$DIGEST" \
            > release-artifacts/image-digest.txt
          (cd release-artifacts && sha256sum sbom-*.spdx.json image-digest.txt > SHA256SUMS)

      - name: Assemble a draft, verify every asset and publish it immutably
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f "tag_name=${GITHUB_REF_NAME}" -f "target_commitish=${GITHUB_SHA}" \
            --jq '.body' > release-artifacts/release-notes.md
          {
            printf '\n## Imagen verificable\n\n'
            printf 'La imagen multi-arquitectura publicada queda fijada por:\n\n```text\n'
            cat release-artifacts/image-digest.txt
            printf '```\n\nLos SBOM SPDX y sus sumas SHA-256 se adjuntan a esta release.\n'
          } >> release-artifacts/release-notes.md

          files=(
            release-artifacts/SHA256SUMS
            release-artifacts/image-digest.txt
            release-artifacts/sbom-amd64.spdx.json
            release-artifacts/sbom-arm64.spdx.json
          )
          remote_tag_identity() {
            local reference tag_object tag_type tag_oid target_type commit_oid
            reference="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")"
            tag_type="$(jq -r '.object.type' <<<"$reference")"
            tag_oid="$(jq -r '.object.sha' <<<"$reference")"
            test "$tag_type" = "tag" && [[ "$tag_oid" =~ ^[0-9a-f]{40}$ ]] || {
              echo "El ref remoto no contiene un tag anotado válido" >&2
              return 1
            }
            tag_object="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/git/tags/${tag_oid}")"
            target_type="$(jq -r '.object.type' <<<"$tag_object")"
            commit_oid="$(jq -r '.object.sha' <<<"$tag_object")"
            test "$target_type" = "commit" && [[ "$commit_oid" =~ ^[0-9a-f]{40}$ ]] || {
              echo "El tag anotado remoto no apunta directamente a un commit válido" >&2
              return 1
            }
            printf '%s %s\n' "$tag_oid" "$commit_oid"
          }

          read -r tag_oid tag_commit_oid < <(remote_tag_identity)
          test "$tag_oid" = "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}")" \
            && test "$tag_commit_oid" = "$GITHUB_SHA" || {
            echo "El tag remoto no coincide con el tag y commit validados por checkout" >&2
            exit 1
          }
          if test "${{ steps.existing.outputs.release_state }}" = "draft"; then
            partial="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/releases/${{ steps.existing.outputs.release_id }}")"
            jq -e --arg tag "$GITHUB_REF_NAME" \
              '.tag_name == $tag and .draft == true and .immutable == false' \
              <<<"$partial" >/dev/null
            partial_id="$(jq -r '.id' <<<"$partial")"
            [[ "$partial_id" =~ ^[1-9][0-9]*$ ]] || {
              echo "El draft parcial no tiene un identificador válido" >&2
              exit 1
            }
            gh api -H 'X-GitHub-Api-Version: 2026-03-10' --method DELETE \
              "repos/${GITHUB_REPOSITORY}/releases/${partial_id}"
            read -r current_tag_oid current_tag_commit_oid < <(remote_tag_identity)
            test "$current_tag_oid" = "$tag_oid" \
              && test "$current_tag_commit_oid" = "$tag_commit_oid" || {
              echo "Recuperar el draft alteró el tag remoto" >&2
              exit 1
            }
          fi
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --notes-file release-artifacts/release-notes.md \
            --title "$GITHUB_REF_NAME" \
            "${files[@]}"

          matches='[]'
          for _ in 1 2 3 4 5; do
            releases="$(gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
            matches="$(jq -c --arg tag "$GITHUB_REF_NAME" \
              '[.[][] | select(.tag_name == $tag)]' <<<"$releases")"
            test "$(jq 'length' <<<"$matches")" -eq 1 && break
            sleep 2
          done
          test "$(jq 'length' <<<"$matches")" -eq 1 || {
            echo "No se pudo resolver un único draft para ${GITHUB_REF_NAME}" >&2
            exit 1
          }
          draft="$(jq '.[0]' <<<"$matches")"
          jq -e --arg tag "$GITHUB_REF_NAME" \
            '.tag_name == $tag and .draft == true and .immutable == false' \
            <<<"$draft" >/dev/null
          release_id="$(jq -r '.id' <<<"$draft")"

          verify_assets() {
            local release_json="$1"
            local names
            names="$(jq -r '[.assets[].name] | sort | join(",")' <<<"$release_json")"
            test "$names" = \
              'SHA256SUMS,image-digest.txt,sbom-amd64.spdx.json,sbom-arm64.spdx.json' || {
              echo "La release no contiene el conjunto exacto de assets" >&2
              return 1
            }
            for file in "${files[@]}"; do
              local name digest size
              name="$(basename "$file")"
              digest="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
              size="$(stat -c '%s' "$file")"
              jq -e --arg name "$name" --arg digest "$digest" \
                --argjson size "$size" '
                  [.assets[] | select(
                    .name == $name and .state == "uploaded" and
                    .digest == $digest and .size == $size
                  )] | length == 1' <<<"$release_json" >/dev/null || {
                echo "El asset ${name} no coincide en nombre, tamaño o SHA-256" >&2
                return 1
              }
            done
          }

          draft="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"
          jq -e '.draft == true and .immutable == false' <<<"$draft" >/dev/null
          verify_assets "$draft"

          published="$(gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F draft=false -F prerelease=false)"
          jq -e --arg tag "$GITHUB_REF_NAME" '
            .tag_name == $tag and .draft == false and .immutable == true' \
            <<<"$published" >/dev/null || {
            echo "GitHub no confirmó que la release publicada sea inmutable" >&2
            exit 1
          }
          verify_assets "$published"
          read -r published_tag_oid published_tag_commit_oid < <(remote_tag_identity)
          test "$published_tag_oid" = "$tag_oid" \
            && test "$published_tag_commit_oid" = "$tag_commit_oid" \
            && test "$published_tag_commit_oid" = "$GITHUB_SHA" || {
            echo "Publicar la release alteró el tag anotado o su commit" >&2
            exit 1
          }
